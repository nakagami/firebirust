[package]
name = "firebirust"
version = "0.6.4"
authors = ["Hajime Nakagami <nakagami@gmail.com>"]
description = "Firebird client library"
license = "MIT"
repository = "https://github.com/nakagami/firebirust"
keywords = ["database", "sql"]
categories = ["database"]
edition = "2024"

[dependencies]
num-bigint = "0.5"
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
maplit = "1.0"
rust-crypto = "0.2"
hex = "0.4"
rand = "0.10"
url = "2.5"
percent-encoding = "2.3"
chrono = "0.4"
chrono-tz = "0.10"
urlencoding = "2.1"
async-net = "2.0"
futures-lite = "2.6"
smol = "2.0"
