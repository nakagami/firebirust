name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebird-version: ['3', '4', '5']
        include:
          - firebird-version: '3'
            firebird-image: 'firebirdsql/firebird:3'
          - firebird-version: '4'
            firebird-image: 'firebirdsql/firebird:4'
          - firebird-version: '5'
            firebird-image: 'firebirdsql/firebird:5'

    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        volumes:
          - /tmp:/tmp
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_CONF_AuthServer: Srp256, Srp, Legacy_Auth
          FIREBIRD_CONF_WireCrypt: Enabled
          FIREBIRD_CONF_DefaultTimeZone: GMT
        ports:
          - 3050:3050
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      env:
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
      run: |
        cargo test
#        cargo test -- --ignored
